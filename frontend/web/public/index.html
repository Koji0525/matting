<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLMMP - プロフィール検索</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; background: #f5f5f5; color: #333; padding: 20px; }
    .container { max-width: 1400px; margin: 0 auto; }
    h1 { margin-bottom: 30px; color: #2c5282; }
    
    /* 検索フィルター */
    .filters { background: white; padding: 30px; border-radius: 10px; margin-bottom: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 20px; }
    .filter-item { display: flex; flex-direction: column; }
    .filter-item label { font-weight: 600; margin-bottom: 8px; color: #555; font-size: 14px; }
    .filter-item select, .filter-item input { padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
    .filter-actions { display: flex; gap: 10px; margin-top: 20px; }
    .btn { padding: 12px 30px; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 14px; transition: all 0.2s; }
    .btn-primary { background: #2c5282; color: white; }
    .btn-primary:hover { background: #1a365d; }
    .btn-secondary { background: #e2e8f0; color: #2c5282; }
    .btn-secondary:hover { background: #cbd5e0; }
    
    /* ユーザー選択 */
    .user-selector { background: white; padding: 20px; border-radius: 10px; margin-bottom: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .user-selector select { padding: 10px; border: 1px solid #ddd; border-radius: 5px; width: 300px; font-size: 14px; }
    
    /* プロフィールカード */
    .profiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }
    .card { background: white; border-radius: 10px; padding: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: transform 0.2s, box-shadow 0.2s; }
    .card:hover { transform: translateY(-5px); box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
    .card.me { border: 3px solid #48bb78; background: #f0fff4; }
    .card-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 15px; }
    .card-name { font-size: 24px; font-weight: 700; color: #2c5282; }
    .card-age { font-size: 18px; color: #666; }
    .card-info { margin-bottom: 12px; font-size: 14px; color: #555; line-height: 1.6; }
    .card-info strong { color: #2c5282; min-width: 90px; display: inline-block; }
    .card-bio { margin: 15px 0; padding: 15px; background: #f7fafc; border-radius: 5px; font-size: 14px; line-height: 1.6; color: #4a5568; }
    .card-actions { display: flex; gap: 10px; margin-top: 15px; }
    .card-btn { flex: 1; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 14px; transition: all 0.2s; }
    .card-btn.like { background: #fed7d7; color: #c53030; }
    .card-btn.like:hover { background: #fc8181; color: white; }
    .card-btn.chat { background: #bee3f8; color: #2c5282; }
    .card-btn.chat:hover { background: #4299e1; color: white; }
    
    .empty { text-align: center; padding: 60px 20px; color: #999; font-size: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>💑 MLMMP プロフィール検索</h1>
    
    <!-- ユーザー選択 -->
    <div class="user-selector">
      <label><strong>👤 ログインユーザー:</strong></label>
      <select id="userSelect" onchange="changeUser()">
        <option value="">選択してください</option>
      </select>
      <span id="userName" style="margin-left: 15px; color: #2c5282; font-weight: 600;"></span>
    </div>
    
    <!-- 検索フィルター -->
    <div class="filters">
      <h2 style="margin-bottom: 20px; color: #2c5282;">🔍 詳細検索</h2>
      <div class="filter-grid">
        <!-- 年齢 -->
        <div class="filter-item">
          <label>年齢</label>
          <div style="display: flex; gap: 10px; align-items: center;">
            <input type="number" id="minAge" placeholder="最小" min="18" max="99" style="width: 100px;">
            <span>〜</span>
            <input type="number" id="maxAge" placeholder="最大" min="18" max="99" style="width: 100px;">
          </div>
        </div>
        
        <!-- 性別 -->
        <div class="filter-item">
          <label>性別</label>
          <select id="gender">
            <option value="">指定なし</option>
            <option value="male">男性</option>
            <option value="female">女性</option>
            <option value="other">その他</option>
          </select>
        </div>
        
        <!-- 都道府県 -->
        <div class="filter-item">
          <label>都道府県</label>
          <select id="prefecture">
            <option value="">指定なし</option>
            <option value="東京都">東京都</option>
            <option value="大阪府">大阪府</option>
            <option value="神奈川県">神奈川県</option>
            <option value="愛知県">愛知県</option>
            <option value="福岡県">福岡県</option>
            <option value="千葉県">千葉県</option>
            <option value="京都府">京都府</option>
            <option value="埼玉県">埼玉県</option>
            <option value="北海道">北海道</option>
          </select>
        </div>
        
        <!-- 身長 -->
        <div class="filter-item">
          <label>身長 (cm)</label>
          <div style="display: flex; gap: 10px; align-items: center;">
            <input type="number" id="minHeight" placeholder="最小" min="140" max="200" style="width: 100px;">
            <span>〜</span>
            <input type="number" id="maxHeight" placeholder="最大" min="140" max="200" style="width: 100px;">
          </div>
        </div>
        
        <!-- 体型 -->
        <div class="filter-item">
          <label>体型</label>
          <select id="bodyType">
            <option value="">指定なし</option>
            <option value="スリム">スリム</option>
            <option value="普通">普通</option>
            <option value="ややぽっちゃり">ややぽっちゃり</option>
            <option value="グラマー">グラマー</option>
            <option value="筋肉質">筋肉質</option>
            <option value="大柄">大柄</option>
          </select>
        </div>
        
        <!-- 学歴 -->
        <div class="filter-item">
          <label>最終学歴</label>
          <select id="education">
            <option value="">指定なし</option>
            <option value="高校卒業">高校卒業</option>
            <option value="専門学校卒業">専門学校卒業</option>
            <option value="短大卒業">短大卒業</option>
            <option value="大学卒業">大学卒業</option>
            <option value="大学院卒業">大学院卒業</option>
          </select>
        </div>
        
        <!-- 年収 -->
        <div class="filter-item">
          <label>年収</label>
          <select id="annualIncome">
            <option value="">指定なし</option>
            <option value="200万円未満">200万円未満</option>
            <option value="200-400万円">200-400万円</option>
            <option value="400-600万円">400-600万円</option>
            <option value="600-800万円">600-800万円</option>
            <option value="800-1000万円">800-1000万円</option>
            <option value="1000-1500万円">1000-1500万円</option>
            <option value="1500万円以上">1500万円以上</option>
          </select>
        </div>
        
        <!-- 結婚希望時期 -->
        <div class="filter-item">
          <label>結婚希望時期</label>
          <select id="marriageDesire">
            <option value="">指定なし</option>
            <option value="良い人がいればすぐにでも">すぐにでも</option>
            <option value="2〜3年以内">2〜3年以内</option>
            <option value="いつか結婚したい">いつか</option>
          </select>
        </div>
        
        <!-- 子供の希望 -->
        <div class="filter-item">
          <label>子供の希望</label>
          <select id="childrenDesire">
            <option value="">指定なし</option>
            <option value="欲しい">欲しい</option>
            <option value="できればほしい">できればほしい</option>
            <option value="相手次第">相手次第</option>
          </select>
        </div>
        
        <!-- タバコ -->
        <div class="filter-item">
          <label>タバコ</label>
          <select id="smoking">
            <option value="">指定なし</option>
            <option value="吸わない">吸わない</option>
            <option value="禁煙中">禁煙中</option>
          </select>
        </div>
        
        <!-- お酒 -->
        <div class="filter-item">
          <label>お酒</label>
          <select id="drinking">
            <option value="">指定なし</option>
            <option value="飲まない">飲まない</option>
            <option value="ときどき飲む">ときどき飲む</option>
            <option value="よく飲む">よく飲む</option>
            <option value="付き合い程度">付き合い程度</option>
          </select>
        </div>
        
        <!-- 血液型 -->
        <div class="filter-item">
          <label>血液型</label>
          <select id="bloodType">
            <option value="">指定なし</option>
            <option value="A">A型</option>
            <option value="B">B型</option>
            <option value="O">O型</option>
            <option value="AB">AB型</option>
          </select>
        </div>
      </div>
      
      <div class="filter-actions">
        <button class="btn btn-primary" onclick="search()">🔍 検索</button>
        <button class="btn btn-secondary" onclick="reset()">🔄 リセット</button>
      </div>
    </div>
    
    <!-- プロフィール一覧 -->
    <div id="results"></div>
  </div>

  <script>
    const API = 'https://silver-space-cod-w6xr46r4q4r39675-3002.app.github.dev/api';
    let userId = null, userName = '', allProfiles = [];
    
    async function init() {
      try {
        const res = await fetch(API + '/profiles');
        const data = await res.json();
        if (!data.success) throw new Error('データ取得失敗');
        
        allProfiles = data.data;
        const sel = document.getElementById('userSelect');
        sel.innerHTML = '<option value="">選択...</option>' + 
          data.data.map(u => `<option value="${u.id}">${u.name} (${u.age}歳)</option>`).join('');
        
        const saved = localStorage.getItem('userId');
        if (saved && allProfiles.find(u => u.id === saved)) {
          userId = saved;
          userName = localStorage.getItem('userName');
          sel.value = userId;
          document.getElementById('userName').textContent = '現在: ' + userName;
          search();
        }
      } catch (e) {
        console.error(e);
        document.getElementById('results').innerHTML = 
          '<div class="empty">❌ データ取得エラー: ' + e.message + '</div>';
      }
    }
    
    function changeUser() {
      const sel = document.getElementById('userSelect');
      const u = allProfiles.find(p => p.id === sel.value);
      if (u) {
        userId = u.id;
        userName = u.name;
        localStorage.setItem('userId', userId);
        localStorage.setItem('userName', userName);
        document.getElementById('userName').textContent = '現在: ' + userName;
        search();
      }
    }
    
    function search() {
      if (!userId) {
        document.getElementById('results').innerHTML = '<div class="empty">ログインユーザーを選択してください</div>';
        return;
      }
      
      // フィルター取得
      const filters = {
        minAge: document.getElementById('minAge').value,
        maxAge: document.getElementById('maxAge').value,
        gender: document.getElementById('gender').value,
        prefecture: document.getElementById('prefecture').value,
        minHeight: document.getElementById('minHeight').value,
        maxHeight: document.getElementById('maxHeight').value,
        bodyType: document.getElementById('bodyType').value,
        education: document.getElementById('education').value,
        annualIncome: document.getElementById('annualIncome').value,
        marriageDesire: document.getElementById('marriageDesire').value,
        childrenDesire: document.getElementById('childrenDesire').value,
        smoking: document.getElementById('smoking').value,
        drinking: document.getElementById('drinking').value,
        bloodType: document.getElementById('bloodType').value
      };
      
      // フィルタリング
      let filtered = allProfiles.filter(p => {
        if (filters.minAge && p.age < parseInt(filters.minAge)) return false;
        if (filters.maxAge && p.age > parseInt(filters.maxAge)) return false;
        if (filters.gender && p.gender !== filters.gender) return false;
        if (filters.prefecture && p.prefecture !== filters.prefecture) return false;
        if (filters.minHeight && p.height < parseInt(filters.minHeight)) return false;
        if (filters.maxHeight && p.height > parseInt(filters.maxHeight)) return false;
        if (filters.bodyType && p.bodyType !== filters.bodyType) return false;
        if (filters.education && p.education !== filters.education) return false;
        if (filters.annualIncome && p.annualIncome !== filters.annualIncome) return false;
        if (filters.marriageDesire && p.marriageDesire !== filters.marriageDesire) return false;
        if (filters.childrenDesire && p.childrenDesire !== filters.childrenDesire) return false;
        if (filters.smoking && p.smoking !== filters.smoking) return false;
        if (filters.drinking && p.drinking !== filters.drinking) return false;
        if (filters.bloodType && p.bloodType !== filters.bloodType) return false;
        return true;
      });
      
      displayResults(filtered);
    }
    
    function displayResults(profiles) {
      const div = document.getElementById('results');
      
      if (profiles.length === 0) {
        div.innerHTML = '<div class="empty">😢 条件に合う相手が見つかりませんでした</div>';
        return;
      }
      
      div.innerHTML = '<div class="profiles">' + profiles.map(p => {
        const isMe = p.id === userId;
        return `<div class="card ${isMe ? 'me' : ''}">
          <div class="card-header">
            <div>
              <div class="card-name">${p.name}</div>
              <div class="card-age">${p.age}歳 ${isMe ? '(あなた)' : ''}</div>
            </div>
          </div>
          <div class="card-info"><strong>性別:</strong> ${p.gender === 'male' ? '男性' : p.gender === 'female' ? '女性' : 'その他'}</div>
          ${p.height ? `<div class="card-info"><strong>身長:</strong> ${p.height}cm</div>` : ''}
          ${p.bodyType ? `<div class="card-info"><strong>体型:</strong> ${p.bodyType}</div>` : ''}
          ${p.prefecture ? `<div class="card-info"><strong>居住地:</strong> ${p.prefecture} ${p.city || ''}</div>` : ''}
          ${p.occupation ? `<div class="card-info"><strong>職業:</strong> ${p.occupation}</div>` : ''}
          ${p.education ? `<div class="card-info"><strong>学歴:</strong> ${p.education}</div>` : ''}
          ${p.annualIncome ? `<div class="card-info"><strong>年収:</strong> ${p.annualIncome}</div>` : ''}
          ${p.hobbies ? `<div class="card-info"><strong>趣味:</strong> ${p.hobbies}</div>` : ''}
          ${p.marriageDesire ? `<div class="card-info"><strong>結婚:</strong> ${p.marriageDesire}</div>` : ''}
          ${p.childrenDesire ? `<div class="card-info"><strong>子供:</strong> ${p.childrenDesire}</div>` : ''}
          ${p.smoking ? `<div class="card-info"><strong>タバコ:</strong> ${p.smoking}</div>` : ''}
          ${p.drinking ? `<div class="card-info"><strong>お酒:</strong> ${p.drinking}</div>` : ''}
          ${p.bio ? `<div class="card-bio">${esc(p.bio)}</div>` : ''}
          ${!isMe ? `<div class="card-actions">
            <button class="card-btn like" onclick="like('${p.id}')">❤️ いいね</button>
            <button class="card-btn chat" onclick="openChat('${p.id}','${p.name}')">💬 メッセージ</button>
          </div>` : ''}
        </div>`;
      }).join('') + '</div>';
    }
    
    function esc(t) {
      const d = document.createElement('div');
      d.textContent = t;
      return d.innerHTML;
    }
    
    function reset() {
      document.getElementById('minAge').value = '';
      document.getElementById('maxAge').value = '';
      document.getElementById('gender').value = '';
      document.getElementById('prefecture').value = '';
      document.getElementById('minHeight').value = '';
      document.getElementById('maxHeight').value = '';
      document.getElementById('bodyType').value = '';
      document.getElementById('education').value = '';
      document.getElementById('annualIncome').value = '';
      document.getElementById('marriageDesire').value = '';
      document.getElementById('childrenDesire').value = '';
      document.getElementById('smoking').value = '';
      document.getElementById('drinking').value = '';
      document.getElementById('bloodType').value = '';
      search();
    }
    
    async function like(toId) {
      if (!userId) return alert('ログインが必要です');
      try {
        const res = await fetch(API + '/likes', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({fromProfileId: userId, toProfileId: toId})
        });
        const data = await res.json();
        if (data.success) alert('❤️ いいねを送信しました！');
        else alert('❌ エラー: ' + (data.message || '送信失敗'));
      } catch (e) {
        alert('❌ エラー: ' + e.message);
      }
    }
    
    function openChat(id, name) {
      localStorage.setItem('chatId', id);
      localStorage.setItem('chatName', name);
      window.location.href = 'chat.html';
    }
    
    window.addEventListener('load', init);
  </script>
</body>
</html>
