<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLMMP チャット</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; background: #0e1621; color: #fff; height: 100vh; overflow: hidden; }
    .app { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
    .sidebar { background: #17212b; border-right: 1px solid #2b5278; display: flex; flex-direction: column; }
    .sidebar-header { padding: 20px; border-bottom: 1px solid #2b5278; }
    .back { display: inline-block; margin-bottom: 15px; color: white; text-decoration: none; background: #2b5278; padding: 8px 15px; border-radius: 5px; }
    .sel { width: 100%; padding: 10px; background: #2b5278; color: white; border: none; border-radius: 5px; }
    .list { flex: 1; overflow-y: auto; }
    .sect { padding: 10px 20px; font-size: 12px; color: #aaa; background: #0e1621; border-bottom: 1px solid #2b5278; }
    .item { padding: 15px 20px; border-bottom: 1px solid #2b5278; cursor: pointer; }
    .item:hover { background: #232e3c; }
    .item.active { background: #2b5278; }
    .name { font-weight: 600; margin-bottom: 5px; }
    .prev { font-size: 13px; color: #aaa; }
    .chat { display: flex; flex-direction: column; background: #0e1621; height: 100vh; }
    .hdr { padding: 15px 20px; background: #17212b; border-bottom: 1px solid #2b5278; font-weight: 600; flex-shrink: 0; }
    .msgs { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; min-height: 0; }
    .m-list { display: flex; flex-direction: column; gap: 10px; }
    .m { display: flex; gap: 8px; }
    .m.sent { flex-direction: row-reverse; }
    .m-bub { max-width: 65%; padding: 10px 14px; border-radius: 14px; line-height: 1.4; }
    .m.received .m-bub { background: #182533; border-bottom-left-radius: 4px; }
    .m.sent .m-bub { background: #2b5278; border-bottom-right-radius: 4px; }
    .m-time { font-size: 11px; color: #999; margin-top: 4px; }
    .inp { padding: 15px 20px; background: #17212b; border-top: 1px solid #2b5278; display: flex; gap: 10px; flex-shrink: 0; }
    .inp input { flex: 1; padding: 12px 16px; background: #0e1621; border: 1px solid #2b5278; border-radius: 24px; color: white; outline: none; }
    .inp button { padding: 12px 24px; background: #2b5278; border: none; border-radius: 24px; color: white; cursor: pointer; }
    .emp { display: flex; align-items: center; justify-content: center; height: 100%; color: #666; flex-direction: column; gap: 10px; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: #2b5278; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="sidebar">
      <div class="sidebar-header">
        <a href="index.html" class="back">← 検索に戻る</a>
        <h2 style="margin-bottom: 15px;">💬 チャット</h2>
        <select class="sel" id="s" onchange="chgU()"><option>選択...</option></select>
      </div>
      <div class="list" id="l"></div>
    </div>
    <div class="chat">
      <div class="hdr" id="h">相手を選択</div>
      <div class="msgs" id="ms"><div class="emp"><div style="font-size:48px;">💬</div><div>相手を選択</div></div></div>
      <div class="inp" id="i" style="display:none;">
        <input type="text" id="t" placeholder="メッセージ..." onkeypress="if(event.key==='Enter')snd()">
        <button onclick="snd()">送信</button>
      </div>
    </div>
  </div>
  <script>
    const API = 'https://silver-space-cod-w6xr46r4q4r39675-3002.app.github.dev/api';
    let uid, us = [], pid, tmr;
    
    async function init() {
      try {
        const r = await fetch(API + '/profiles');
        const d = await r.json();
        if (!d.success) return;
        us = d.data;
        const s = document.getElementById('s');
        s.innerHTML = '<option>選択...</option>' + d.data.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
        const sv = localStorage.getItem('userId');
        if (sv && us.find(u => u.id === sv)) {
          uid = sv;
          s.value = uid;
          ldL();
          const ci = localStorage.getItem('chatId');
          const cn = localStorage.getItem('chatName');
          if (ci && cn) {
            setTimeout(() => { opn(ci, cn); localStorage.removeItem('chatId'); localStorage.removeItem('chatName'); }, 500);
          }
        }
      } catch (e) { console.error(e); }
    }
    
    function chgU() {
      const s = document.getElementById('s');
      const u = us.find(p => p.id === s.value);
      if (!u) return;
      uid = u.id;
      localStorage.setItem('userId', uid);
      localStorage.setItem('userName', u.name);
      pid = null;
      document.getElementById('h').textContent = '相手を選択';
      document.getElementById('ms').innerHTML = '<div class="emp"><div style="font-size:48px;">💬</div></div>';
      document.getElementById('i').style.display = 'none';
      if (tmr) { clearInterval(tmr); tmr = null; }
      ldL();
    }
    
    async function ldL() {
      if (!uid) return;
      const l = document.getElementById('l');
      l.innerHTML = '<div class="emp">読み込み中...</div>';
      try {
        const r = await fetch(API + '/messages/' + uid);
        const d = await r.json();
        if (!d.success) return;
        const ch = new Map();
        d.data.forEach(m => {
          if (!m.fromProfile || !m.toProfile) return;
          const p = m.fromProfileId === uid ? m.toProfileId : m.fromProfileId;
          const pf = m.fromProfileId === uid ? m.toProfile : m.fromProfile;
          if (!ch.has(p)) ch.set(p, { id: p, name: pf.name, msg: m.message });
        });
        const cU = us.filter(u => u.id !== uid && ch.has(u.id));
        const nU = us.filter(u => u.id !== uid && !ch.has(u.id));
        let h = '';
        if (cU.length > 0) {
          h += '<div class="sect">💬 チャット中</div>';
          h += cU.map(u => {
            const i = ch.get(u.id);
            return `<div class="item" onclick="opn('${u.id}','${u.name}')"><div class="name">${u.name}</div><div class="prev">${i.msg.substring(0,30)}...</div></div>`;
          }).join('');
        }
        if (nU.length > 0) {
          h += '<div class="sect">👤 全ユーザー</div>';
          h += nU.map(u => `<div class="item" onclick="opn('${u.id}','${u.name}')"><div class="name">${u.name}</div><div class="prev">チャット開始</div></div>`).join('');
        }
        l.innerHTML = h || '<div class="emp">なし</div>';
      } catch (e) { console.error(e); }
    }
    
    function opn(id, nm) {
      pid = id;
      document.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
      if (event && event.target) event.target.closest('.item').classList.add('active');
      document.getElementById('h').textContent = '💬 ' + nm;
      document.getElementById('i').style.display = 'flex';
      ld();
      if (tmr) clearInterval(tmr);
      tmr = setInterval(ld, 3000);
    }
    
    async function ld() {
      if (!pid) return;
      try {
        const r = await fetch(API + '/messages/' + uid);
        const d = await r.json();
        if (!d.success) return;
        
        // フィルタ + ソート（古い順）
        const ms = d.data
          .filter(m => (m.fromProfileId === uid && m.toProfileId === pid) || (m.fromProfileId === pid && m.toProfileId === uid))
          .sort((a, b) => {
            // created_at または createdAt を試す
            const dtA = new Date(a.created_at || a.createdAt);
            const dtB = new Date(b.created_at || b.createdAt);
            return dtA - dtB;
          });
        
        console.log('メッセージ数:', ms.length);
        if (ms.length > 0) {
          const first = ms[0];
          const last = ms[ms.length - 1];
          console.log('最初:', first.message, new Date(first.created_at || first.createdAt));
          console.log('最後:', last.message, new Date(last.created_at || last.createdAt));
        }
        
        const box = document.getElementById('ms');
        if (ms.length === 0) {
          box.innerHTML = '<div class="emp"><div style="font-size:48px;">👋</div><div>まだメッセージなし</div></div>';
          return;
        }
        
        const html = '<div class="m-list">' + ms.map(m => {
          const snt = m.fromProfileId === uid;
          const dt = new Date(m.created_at || m.createdAt);
          const tm = !isNaN(dt.getTime()) ? dt.toLocaleTimeString('ja-JP', {hour:'2-digit',minute:'2-digit'}) : '';
          return `<div class="m ${snt ? 'sent' : 'received'}"><div class="m-bub">${esc(m.message)}<div class="m-time">${tm}</div></div></div>`;
        }).join('') + '</div>';
        
        box.innerHTML = html;
        box.scrollTop = box.scrollHeight;
      } catch (e) { console.error(e); }
    }
    
    function esc(t) { return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    
    async function snd() {
      const inp = document.getElementById('t');
      const msg = inp.value.trim();
      if (!msg || !pid) return;
      try {
        const r = await fetch(API + '/messages', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({fromProfileId: uid, toProfileId: pid, message: msg})
        });
        const d = await r.json();
        if (!d.success) throw new Error('失敗');
        inp.value = '';
        await ld();
        ldL();
      } catch (e) { console.error(e); }
    }
    
    window.addEventListener('load', init);
  </script>
</body>
</html>
