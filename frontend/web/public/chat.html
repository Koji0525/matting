<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チャット - MLMMP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; background: #0d1117; color: #c9d1d9; height: 100vh; overflow: hidden; }
    
    .chat-area { display: flex; flex-direction: column; height: 100vh; }
    .header { background: #161b22; padding: 20px; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
    .header h2 { color: #58a6ff; }
    .back-btn { padding: 10px 20px; background: #21262d; color: #58a6ff; border: 1px solid #30363d; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .back-btn:hover { background: #30363d; }
    
    .msgs { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; min-height: 0; }
    .msg { max-width: 70%; margin-bottom: 15px; padding: 12px 16px; border-radius: 18px; word-wrap: break-word; }
    .msg.me { align-self: flex-end; background: #238636; color: white; }
    .msg.other { align-self: flex-start; background: #21262d; color: #c9d1d9; }
    .msg-time { font-size: 11px; opacity: 0.6; margin-top: 4px; }
    
    .inp { flex-shrink: 0; padding: 20px; background: #161b22; border-top: 1px solid #30363d; display: flex; gap: 10px; }
    .inp input { flex: 1; padding: 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font-size: 14px; }
    .inp button { padding: 12px 24px; background: #238636; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .inp button:hover { background: #2ea043; }
  </style>
</head>
<body>
  <div class="chat-area">
    <div class="header">
      <h2 id="chatName">チャット</h2>
      <button class="back-btn" onclick="window.location.href='index.html'">← 戻る</button>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="inp">
      <input type="text" id="msgInput" placeholder="メッセージを入力..." onkeypress="if(event.key==='Enter') send()">
      <button onclick="send()">送信</button>
    </div>
  </div>

  <script>
    const API = 'https://silver-space-cod-w6xr46r4q4r39675-3002.app.github.dev/api';
    const userId = localStorage.getItem('userId');
    const chatId = localStorage.getItem('chatId');
    const chatName = localStorage.getItem('chatName');
    
    if (!userId || !chatId) {
      alert('ログインしてください');
      window.location.href = 'index.html';
    }
    
    document.getElementById('chatName').textContent = chatName + ' とのチャット';
    
    let unreadMessageIds = [];
    
    async function load() {
      try {
        const res = await fetch(API + '/messages/' + userId);
        const data = await res.json();
        
        if (!data.success) throw new Error('取得失敗');
        
        // 相手とのメッセージのみフィルター
        const msgs = data.data
          .filter(m => 
            (m.fromProfileId === userId && m.toProfileId === chatId) ||
            (m.fromProfileId === chatId && m.toProfileId === userId)
          )
          .sort((a, b) => {
            const dtA = new Date(a.createdAt || a.created_at);
            const dtB = new Date(b.createdAt || b.created_at);
            return dtA - dtB;
          });
        
        // 未読メッセージID収集（自分宛ての未読のみ）
        unreadMessageIds = msgs
          .filter(m => m.toProfileId === userId && !m.read)
          .map(m => m.id);
        
        const box = document.getElementById('msgs');
        box.innerHTML = msgs.map(m => {
          const isMe = m.fromProfileId === userId;
          const dt = new Date(m.createdAt || m.created_at);
          const time = !isNaN(dt.getTime()) ? 
            dt.toLocaleTimeString('ja-JP', {hour:'2-digit',minute:'2-digit'}) : '';
          
          return `<div class="msg ${isMe ? 'me' : 'other'}">
            <div>${esc(m.message)}</div>
            ${time ? `<div class="msg-time">${time}</div>` : ''}
          </div>`;
        }).join('');
        
        box.scrollTop = box.scrollHeight;
        
        // 未読メッセージを自動既読処理
        if (unreadMessageIds.length > 0) {
          await markMessagesAsRead(unreadMessageIds);
        }
      } catch (e) {
        console.error(e);
      }
    }
    
    async function markMessagesAsRead(messageIds) {
      try {
        await fetch(API + '/messages/mark-multiple-read', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ messageIds })
        });
        console.log('既読処理完了:', messageIds.length, '件');
      } catch (e) {
        console.error('既読処理エラー:', e);
      }
    }
    
    async function send() {
      const inp = document.getElementById('msgInput');
      const msg = inp.value.trim();
      if (!msg) return;
      
      try {
        const res = await fetch(API + '/messages', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            fromProfileId: userId,
            toProfileId: chatId,
            message: msg
          })
        });
        
        const data = await res.json();
        if (data.success) {
          inp.value = '';
          load();
        } else {
          alert('送信失敗');
        }
      } catch (e) {
        alert('エラー: ' + e.message);
      }
    }
    
    function esc(t) {
      const d = document.createElement('div');
      d.textContent = t;
      return d.innerHTML;
    }
    
    // 初回読み込み + 3秒ごとに更新
    load();
    setInterval(load, 3000);
  </script>
</body>
</html>
