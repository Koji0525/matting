<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プロフィール編集 - MLMMP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; background: #f5f5f5; color: #333; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    
    .header { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
    h1 { color: #2c5282; font-size: 24px; }
    .back-btn { padding: 8px 16px; background: #e2e8f0; color: #2c5282; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; }
    .back-btn:hover { background: #cbd5e0; }
    
    .form { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .form-section { margin-bottom: 30px; }
    .form-section h2 { color: #2c5282; font-size: 18px; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #e2e8f0; }
    
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
    .form-item { display: flex; flex-direction: column; }
    .form-item label { font-weight: 600; margin-bottom: 8px; color: #555; font-size: 14px; }
    .form-item input, .form-item select, .form-item textarea { padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; font-family: sans-serif; }
    .form-item input:focus, .form-item select:focus, .form-item textarea:focus { outline: none; border-color: #2c5282; }
    .form-item textarea { resize: vertical; min-height: 100px; }
    
    .required::after { content: ' *'; color: #e53e3e; }
    
    .form-actions { display: flex; gap: 15px; margin-top: 30px; }
    .btn { padding: 12px 30px; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 14px; transition: all 0.2s; }
    .btn-primary { background: #2c5282; color: white; flex: 1; }
    .btn-primary:hover { background: #1a365d; }
    .btn-secondary { background: #e2e8f0; color: #2c5282; }
    .btn-secondary:hover { background: #cbd5e0; }
    
    .success { background: #48bb78; color: white; padding: 15px; border-radius: 5px; margin-bottom: 20px; display: none; }
    .error { background: #e53e3e; color: white; padding: 15px; border-radius: 5px; margin-bottom: 20px; display: none; }
    
    .age-display { padding: 10px; background: #f7fafc; border-radius: 5px; color: #2c5282; font-weight: 600; font-size: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>✏️ プロフィール編集</h1>
      <button class="back-btn" onclick="window.location.href='index.html'">← 戻る</button>
    </div>
    
    <div class="success" id="successMsg"></div>
    <div class="error" id="errorMsg"></div>
    
    <form class="form" id="profileForm">
      <div class="form-section">
        <h2>基本情報</h2>
        <div class="form-grid">
          <div class="form-item">
            <label class="required">名前</label>
            <input type="text" id="name" required>
          </div>
          <div class="form-item">
            <label class="required">生年月日</label>
            <input type="date" id="birthdate" required>
          </div>
          <div class="form-item">
            <label>年齢（自動計算）</label>
            <div class="age-display" id="ageDisplay">-</div>
          </div>
          <div class="form-item">
            <label class="required">性別</label>
            <select id="gender" required>
              <option value="">選択してください</option>
              <option value="male">男性</option>
              <option value="female">女性</option>
              <option value="other">その他</option>
            </select>
          </div>
          <div class="form-item">
            <label>血液型</label>
            <select id="bloodType">
              <option value="">選択してください</option>
              <option value="A">A型</option>
              <option value="B">B型</option>
              <option value="O">O型</option>
              <option value="AB">AB型</option>
            </select>
          </div>
          <div class="form-item">
            <label class="required">タイムゾーン</label>
            <select id="timezone" required>
              <option value="Asia/Tokyo">日本（東京）</option>
              <option value="Asia/Shanghai">中国（上海）</option>
              <option value="Asia/Seoul">韓国（ソウル）</option>
              <option value="Asia/Tashkent">ウズベキスタン（タシケント）</option>
              <option value="America/New_York">アメリカ（ニューヨーク）</option>
              <option value="America/Los_Angeles">アメリカ（ロサンゼルス）</option>
              <option value="Europe/London">イギリス（ロンドン）</option>
              <option value="Europe/Paris">フランス（パリ）</option>
              <option value="Australia/Sydney">オーストラリア（シドニー）</option>
            </select>
          </div>
        </div>
      </div>
      
      <div class="form-section">
        <h2>外見</h2>
        <div class="form-grid">
          <div class="form-item">
            <label>身長（cm）</label>
            <input type="number" id="height" min="100" max="250">
          </div>
          <div class="form-item">
            <label>体型</label>
            <select id="bodyType">
              <option value="">選択してください</option>
              <option value="slender">スリム</option>
              <option value="average">普通</option>
              <option value="athletic">アスリート</option>
              <option value="muscular">筋肉質</option>
              <option value="curvy">ぽっちゃり</option>
              <option value="plus-size">大柄</option>
            </select>
          </div>
        </div>
      </div>
      
      <div class="form-section">
        <h2>居住地</h2>
        <div class="form-grid">
          <div class="form-item">
            <label>国</label>
            <input type="text" id="country">
          </div>
          <div class="form-item">
            <label>都道府県</label>
            <input type="text" id="prefecture">
          </div>
          <div class="form-item">
            <label>市区町村</label>
            <input type="text" id="city">
          </div>
        </div>
      </div>
      
      <div class="form-section">
        <h2>職業・学歴</h2>
        <div class="form-grid">
          <div class="form-item">
            <label>職業</label>
            <input type="text" id="occupation">
          </div>
          <div class="form-item">
            <label>学歴</label>
            <select id="education">
              <option value="">選択してください</option>
              <option value="high-school">高校卒業</option>
              <option value="vocational">専門学校卒業</option>
              <option value="associate">短大卒業</option>
              <option value="bachelor">大学卒業</option>
              <option value="master">修士課程修了</option>
              <option value="doctorate">博士課程修了</option>
            </select>
          </div>
          <div class="form-item">
            <label>年収</label>
            <select id="annualIncome">
              <option value="">選択してください</option>
              <option value="under-3m">300万円未満</option>
              <option value="3m-5m">300-500万円</option>
              <option value="5m-7m">500-700万円</option>
              <option value="7m-10m">700-1000万円</option>
              <option value="10m-15m">1000-1500万円</option>
              <option value="15m-20m">1500-2000万円</option>
              <option value="over-20m">2000万円以上</option>
            </select>
          </div>
        </div>
      </div>
      
      <div class="form-section">
        <h2>ライフスタイル</h2>
        <div class="form-grid">
          <div class="form-item">
            <label>タバコ</label>
            <select id="smoking">
              <option value="">選択してください</option>
              <option value="non-smoker">吸わない</option>
              <option value="sometimes">時々吸う</option>
              <option value="smoker">吸う</option>
              <option value="trying-to-quit">禁煙中</option>
            </select>
          </div>
          <div class="form-item">
            <label>お酒</label>
            <select id="drinking">
              <option value="">選択してください</option>
              <option value="non-drinker">飲まない</option>
              <option value="occasionally">たまに飲む</option>
              <option value="socially">付き合い程度</option>
              <option value="regularly">よく飲む</option>
            </select>
          </div>
          <div class="form-item">
            <label>宗教</label>
            <input type="text" id="religion">
          </div>
          <div class="form-item">
            <label>結婚歴</label>
            <select id="marriageHistory">
              <option value="">選択してください</option>
              <option value="never-married">未婚</option>
              <option value="divorced">離婚</option>
              <option value="widowed">死別</option>
            </select>
          </div>
          <div class="form-item">
            <label>子どもの有無</label>
            <select id="hasChildren">
              <option value="">選択してください</option>
              <option value="false">いない</option>
              <option value="true">いる</option>
            </select>
          </div>
        </div>
      </div>
      
      <div class="form-section">
        <h2>自己紹介</h2>
        <div class="form-item">
          <label>自己紹介文</label>
          <textarea id="bio" placeholder="あなたについて自由に書いてください"></textarea>
        </div>
        <div class="form-item">
          <label>その他・補足</label>
          <textarea id="other" placeholder="趣味や特技など"></textarea>
        </div>
      </div>
      
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">💾 保存する</button>
        <button type="button" class="btn btn-secondary" onclick="window.location.href='index.html'">キャンセル</button>
      </div>
    </form>
  </div>

  <script>
    const API = 'https://silver-space-cod-w6xr46r4q4r39675-3002.app.github.dev/api';
    const userId = localStorage.getItem('userId');
    
    if (!userId) {
      alert('ログインしてください');
      window.location.href = 'index.html';
    }
    
    // 年齢自動計算
    function calculateAge() {
      const birthdate = document.getElementById('birthdate').value;
      if (!birthdate) {
        document.getElementById('ageDisplay').textContent = '-';
        return;
      }
      
      const today = new Date();
      const birth = new Date(birthdate);
      let age = today.getFullYear() - birth.getFullYear();
      const monthDiff = today.getMonth() - birth.getMonth();
      if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birth.getDate())) {
        age--;
      }
      
      document.getElementById('ageDisplay').textContent = age + '歳';
    }
    
    document.getElementById('birthdate').addEventListener('change', calculateAge);
    
    // プロフィール読み込み
    async function loadProfile() {
      try {
        const res = await fetch(API + '/profiles/' + userId);
        const data = await res.json();
        if (!data.success) throw new Error('プロフィール取得失敗');
        
        const p = data.data;
        
        document.getElementById('name').value = p.name || '';
        document.getElementById('birthdate').value = p.birthdate || '';
        document.getElementById('gender').value = p.gender || '';
        document.getElementById('bloodType').value = p.bloodType || '';
        document.getElementById('timezone').value = p.timezone || 'Asia/Tokyo';
        document.getElementById('height').value = p.height || '';
        document.getElementById('bodyType').value = p.bodyType || '';
        document.getElementById('country').value = p.country || '';
        document.getElementById('prefecture').value = p.prefecture || '';
        document.getElementById('city').value = p.city || '';
        document.getElementById('occupation').value = p.occupation || '';
        document.getElementById('education').value = p.education || '';
        document.getElementById('annualIncome').value = p.annualIncome || '';
        document.getElementById('smoking').value = p.smoking || '';
        document.getElementById('drinking').value = p.drinking || '';
        document.getElementById('religion').value = p.religion || '';
        document.getElementById('marriageHistory').value = p.marriageHistory || '';
        document.getElementById('hasChildren').value = String(p.hasChildren) || '';
        document.getElementById('bio').value = p.bio || '';
        document.getElementById('other').value = p.other || '';
        
        calculateAge();
      } catch (e) {
        showError('プロフィール読み込みエラー: ' + e.message);
      }
    }
    
    // プロフィール保存
    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const profileData = {
        name: document.getElementById('name').value,
        birthdate: document.getElementById('birthdate').value,
        gender: document.getElementById('gender').value,
        bloodType: document.getElementById('bloodType').value || null,
        timezone: document.getElementById('timezone').value,
        height: document.getElementById('height').value ? parseInt(document.getElementById('height').value) : null,
        bodyType: document.getElementById('bodyType').value || null,
        country: document.getElementById('country').value || null,
        prefecture: document.getElementById('prefecture').value || null,
        city: document.getElementById('city').value || null,
        occupation: document.getElementById('occupation').value || null,
        education: document.getElementById('education').value || null,
        annualIncome: document.getElementById('annualIncome').value || null,
        smoking: document.getElementById('smoking').value || null,
        drinking: document.getElementById('drinking').value || null,
        religion: document.getElementById('religion').value || null,
        marriageHistory: document.getElementById('marriageHistory').value || null,
        hasChildren: document.getElementById('hasChildren').value === 'true' ? true : document.getElementById('hasChildren').value === 'false' ? false : null,
        bio: document.getElementById('bio').value || null,
        other: document.getElementById('other').value || null
      };
      
      try {
        const res = await fetch(API + '/profiles/' + userId, {
          method: 'PUT',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(profileData)
        });
        
        const data = await res.json();
        if (!data.success) throw new Error(data.message || '保存失敗');
        
        showSuccess('プロフィールを保存しました！');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1500);
      } catch (e) {
        showError('保存エラー: ' + e.message);
      }
    });
    
    function showSuccess(msg) {
      const el = document.getElementById('successMsg');
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 5000);
    }
    
    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 5000);
    }
    
    loadProfile();
  </script>
</body>
</html>
